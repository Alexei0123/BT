<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AniStreet</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<header>
  <div class="logo">AniStreet</div>

  <nav>
    <a href="#home">Главная</a>
    <a href="#catalog">Каталог</a>
    <a href="#auth" class="btn">Войти</a>
  </nav>
</header>

<main>

  <!-- 🏠 HOME -->
  <section id="home" class="page active">
    <div class="hero">
      <h1>Добро пожаловать в AniStreet</h1>
      <p>Фигурки, одежда, постеры и аниме товары</p>
      <button class="btn-primary" onclick="goTo('auth')">
        Перейти к входу
      </button>
    </div>
  </section>

  <!-- 🛍 CATALOG -->
  <section id="catalog" class="page">
    <h2>Каталог</h2>

    <div class="grid">
      <div class="card">Фигурка Naruto</div>
      <div class="card">Футболка One Piece</div>
      <div class="card">Постер Attack on Titan</div>
    </div>
  </section>

  <!-- 🔐 AUTH -->
  <section id="auth" class="page">

    <div class="auth-box">

      <!-- tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login', event)">Вход</button>
        <button class="tab" onclick="switchTab('register', event)">Регистрация</button>
      </div>

      <!-- 🔑 LOGIN -->
    <div id="loginForm">

      <div id="loginError" class="error"></div>

      <input id="loginInput" placeholder="Логин" />
      <input id="loginPassword" type="password" placeholder="Пароль" />

      <button onclick="login()" class="btn-primary">Войти</button>

      <p onclick="showForgot()" style="cursor:pointer; color:#6366f1;">
        Забыли пароль?
      </p>

    </div>

      <!-- 🆕 FORGOT -->
    <div id="forgotForm" class="hidden">

      <div id="forgotError" class="error"></div>

      <input id="forgotLogin" placeholder="Логин" />
      <input id="forgotKey" placeholder="Ключевое слово" />
      <input id="forgotPassword" type="password" placeholder="Новый пароль" />

      <button onclick="forgot()" class="btn-primary">
        Сменить пароль
      </button>

      <button onclick="backToLogin()" class="btn-primary">
        Назад
      </button>

    </div>

      <!-- 🆕 REGISTER -->
  <div id="registerForm">

    <div id="registerError" class="error"></div>

    <input id="regLogin" placeholder="Логин" />
    <input id="regName" placeholder="Ник" />
    <input id="regKey" placeholder="Ключевое слово" />
    <input id="regPassword" type="password" placeholder="Пароль" />

    <button onclick="register()" class="btn-primary">
      Создать аккаунт
    </button>

  </div>

    </div>

  </section>
  
  <section id="profile" class="page">
  <div class="auth-box">
    <h2>Личный кабинет</h2>
    <p id="welcomeText">Добро пожаловать</p>
    <button onclick="logout()" class="btn-primary">Выйти</button>
  </div>
  </section>


</main>

<script src="app.js"></script>

</body>
</html>
